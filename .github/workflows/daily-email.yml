name: Daily Cash Buyers Email
on:
  # Disparado pelo cron-job.org (confiavel, fuso America/New_York) via workflow_dispatch.
  # O cron interno do GitHub foi removido (era instavel/atrasava).
  workflow_dispatch: {}
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send deals to cash buyers
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python send_daily.py
