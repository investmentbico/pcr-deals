name: Daily Cash Buyers Email
on:
  schedule:
    - cron: '34 11 * * *'   # ~7:34 AM America/New_York (EDT) — minuto fora de pico
    - cron: '9 17 * * *'    # ~1:09 PM America/New_York (EDT) — minuto fora de pico
  workflow_dispatch: {}      # permite rodar manual pelo botao do GitHub
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send deals to cash buyers
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python send_daily.py
