const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.nonce)},key,b(P.data));
  return new TextDecoder().decode(plain);
}
async function go(){
  const pw=document.getElementById('pw').value.trim();
  document.getElementById('err').textContent='';
  try{
    const html=await dec(pw);
    sessionStorage.setItem('gd_pw',pw);
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('err').textContent='Senha incorreta';}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
(async()=>{const s=sessionStorage.getItem('gd_pw');if(s){try{const h=await dec(s);document.open();document.write(h);document.close();}catch(e){sessionStorage.removeItem('gd_pw')}}})();
</script></body></html>
